name: My CI/CD pipelines using github Actions

on:
  push:
    branches: main

jobs:
  builds:
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4

        - name: Initialize Repo
          run: |
           echo ""
           uname -a
        - name: Check Docker Installation
          run: |
           docker
           docker images

        - name: Run docker Container
          run: |
            docker run hello-world

           
            

      












